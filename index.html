<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProStock | Inventory SPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .glass { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
        }
        .modal-overlay { 
            background: rgba(15, 23, 42, 0.8); 
            display: none; 
            opacity: 0; 
            z-index: 100; 
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900 pb-12">
    <main class="container mx-auto p-4">
        <button id="add-product-btn" class="fixed bottom-4 right-4 bg-blue-600 text-white p-4 rounded-full shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <lucide-icon name="plus" class="w-6 h-6"></lucide-icon>
        <table>
        <thead>
            <tr>
                <th class="px-4 py-2 text-left">#</th>
                <th class="px-4 py-2 text-left">Product Name</th>
                <th class="px-4 py-2 text-left">Price</th>
                <th class="px-4 py-2 text-left">Amount</th>
            </tr>
        </thead>
        <tbody id="product-table-body">
            <!-- Dynamic product rows will be inserted here -->
        </tbody>
    </table>
    </main>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
